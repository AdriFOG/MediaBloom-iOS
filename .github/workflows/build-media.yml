name: MediaBloom - Standalone IPA (experimental)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feature/standalone-media-ipa
  workflow_dispatch:

concurrency:
  group: mediabloom-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-media:
    name: Build independently installable MediaBloom
    runs-on: macos-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout MediaBloom project
        uses: actions/checkout@v6
        with:
          path: media-tools

      # Pin a known-good version. MediaBloom gets its own build and own bundle ID.
      # This does not build or change the installed primary BloomBox app.
      - name: Checkout experimental LiveContainer engine
        uses: actions/checkout@v6
        with:
          repository: AdriFOG/Bloombox-iOS
          ref: 991db585243aa8c2b1ccb454d3d2ea92ea30d7d6
          submodules: recursive
          path: source

      - name: Apply independent MediaBloom identity and protect primary BloomBox
        run: python3 ../media-tools/scripts/prepare_media.py

      - name: Overlay opt-in BloomAudio prototype into MediaBloom only
        run: python3 ../media-tools/scripts/apply_audio.py

      - name: Check BloomAudio live controls and perceived-volume curve
        run: python3 ../media-tools/tests/test_bloomaudio_v03.py

      - name: Read BloomBox shared media labels in MediaBloom
        run: python3 ../media-tools/scripts/apply_media_tags.py

      - name: Check shared media labels without breaking audio
        run: python3 ../media-tools/tests/test_shared_media_labels.py

      - name: Restore checksum-verified Claude MediaBloom UI files
        run: python3 ../media-tools/scripts/materialize_media_ui.py

      - name: Integrate white-bubble MediaBloom Home into the existing launcher
        run: python3 ../media-tools/scripts/apply_media_ui.py

      - name: Check connected UI, guest volume keys and preserved classic settings
        run: python3 ../media-tools/tests/test_media_ui.py

      - name: Apply exact portrait and landscape music reference layouts
        run: python3 ../media-tools/scripts/apply_reference_ui.py

      - name: Verify reference layout, real guest controls and media isolation
        run: python3 ../media-tools/tests/test_reference_ui.py

      - name: Apply wallpaper, theme and independent master-volume controls
        run: python3 ../media-tools/scripts/apply_media_customization.py

      - name: Verify appearance, audio isolation and app-level volume menu
        run: python3 ../media-tools/tests/test_media_customization.py

      - name: Connect favorites-only music discovery and guest song links
        run: python3 ../media-tools/scripts/apply_music_discovery.py

      - name: Validate favorites, artists, catalog APIs and song routing
        run: python3 ../media-tools/tests/test_music_discovery.py

      - name: Connect shared media labels and instant Home refresh
        run: python3 ../media-tools/scripts/apply_final_polish.py

      - name: Validate tag compatibility, near-invisible glass, cached covers and shuffled recommendations
        run: python3 ../media-tools/tests/test_final_polish.py

      - name: Enable Apple Music Haptics declaration and guest ISRC experiment (MediaBloom only)
        run: python3 ../media-tools/scripts/apply_haptics_probe.py

      - name: Validate Apple Music Haptics guest integration and opt-in safety
        run: python3 ../media-tools/tests/test_haptics_probe.py

      - name: Swift syntax check of responsive UI sources
        run: xcrun swiftc -frontend -parse ../media-tools/ui/MediaBloomHomeView.swift ../media-tools/ui/MediaBloomHomeBridge.swift ../media-tools/ui/MediaBloomReferenceView.swift ../media-tools/ui/MediaBloomAppearance.swift ../media-tools/ui/MediaBloomMusicDiscovery.swift ../media-tools/ui/MediaBloomHaptics.swift

      - name: Install MediaBloom system Control Center actions
        run: python3 ../media-tools/scripts/apply_control_center.py

      - name: Verify Control Center buttons, App Group access and audio isolation
        run: python3 ../media-tools/tests/test_control_center.py

      - name: Verify BloomAudio is off by default and restricted to MediaBloom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tweak = Path("TweakLoader/TweakLoader.m").read_text()
          ui = Path("LiveContainerSwiftUI/Views/BloomBox/BloomBoxLauncherRoot.swift").read_text()
          assert "MBInstallAudioHooks();" in tweak
          assert 'com.kdt.bloomboxmedia' in tweak
          assert 'MediaBloomAudioProbeEnabledV1' in tweak
          assert 'MediaBloomAudioProbeEnabledV1' in ui
          assert 'private var audioProbeEnabled = false' in ui
          assert 'BloomBoxMediaAudioSlider' in ui
          assert 'com.google.ios.youtube' in tweak
          assert 'com.google.ios.youtubemusic' in tweak
          print("PASS: media-only, opt-in, per-app BloomAudio prototype")
          PY

      - name: Validate isolated identifiers BEFORE compiling
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          info = plistlib.loads(Path("LiveContainer/Info.plist").read_bytes())
          config = Path("xcconfigs/Global.xcconfig").read_text()
          assert info["BloomBoxMediaEdition"] is True
          assert info["CFBundleURLTypes"][0]["CFBundleURLSchemes"] == ["bloomboxmedia"]
          assert "LIVECONTAINER_BUNDLE_IDENTIFIER = com.kdt.BloomBoxMedia" in config
          assert "group.com.SideStore.SideStore" in config
          assert "group.com.rileytestut.AltStore" in config
          print("PASS: standalone identity and shared App Group contract")
          PY

      - name: Restore pinned runtime and SideStore dependencies
        run: python3 Scripts/fetch-bundled-dependencies.py

      - name: Install Rust compiler for iOS pairing component
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Compile original pairing library
        run: bash Scripts/build-ondevice-pairing.sh

      - name: Generate minimal MediaBloom icon
        run: |
          swift Scripts/generate-bloombox-icon.swift
          swift ../media-tools/scripts/render_media_icon.swift

      - name: Compile standalone MediaBloom IPA
        env:
          archive_path: archive
          scheme: LiveContainer
        run: |
          set -eu
          log="$RUNNER_TEMP/mediabloom-archive.log"
          if xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" \
            -project LiveContainer.xcodeproj -sdk iphoneos -arch arm64 \
            -configuration Release > "$log" 2>&1; then
            echo "MediaBloom native iOS build succeeded"
            tail -n 20 "$log"
          else
            echo "::error::MediaBloom compile failed; showing real errors"
            grep -nE 'error:|fatal error|BUILD FAILED|CompileSwift|SwiftCompile|Undefined symbols|Killed:|signal 9' "$log" | tail -n 90 || true
            tail -n 140 "$log"
            exit 1
          fi

      - name: Package original SideStore-compatible LC runtime
        env:
          scheme: LiveContainer
          archive_path: archive
        run: sh .github/build_github.sh

      - name: Reject unsafe IPA identity and verify shared extensions
        run: |
          python3 ../media-tools/scripts/verify_media.py LiveContainer+SideStore.ipa LiveContainer.ipa
          cp LiveContainer+SideStore.ipa MediaBloom-SideStore-unsigned.ipa

      - name: Upload independent test IPA (never BloomBox primary)
        uses: actions/upload-artifact@v4
        with:
          name: MediaBloom-SideStore-unsigned.ipa
          path: source/MediaBloom-SideStore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14


  publish-stable:
    name: Publish MediaBloom v2.0.0
    # Only the explicit tested release merge commit on main may publish.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: MediaBloom v2.0.0')
    needs: build-media
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated MediaBloom standalone IPA
        uses: actions/download-artifact@v4
        with:
          name: MediaBloom-SideStore-unsigned.ipa
          path: release

      - name: Validate published artifact exists and is intact
        run: |
          set -e
          test -s release/MediaBloom-SideStore-unsigned.ipa
          unzip -t release/MediaBloom-SideStore-unsigned.ipa | tail -n 2
          (cd release && sha256sum MediaBloom-SideStore-unsigned.ipa > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Publish MediaBloom v2.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "MediaBloom 2.0 — Música y personalización"
          target_commitish: ${{ github.sha }}
          prerelease: false
          draft: false
          files: |
            release/MediaBloom-SideStore-unsigned.ipa
            release/SHA256SUMS.txt
          body: |
            ## MediaBloom 2.0 — Música y personalización 💜

            Una nueva interfaz multimedia, un catálogo musical basado en tus artistas favoritos y un diseño totalmente personalizable para iPhone.

            ### Novedades
            - Inicio musical con selección de artistas favoritos y recomendaciones de canciones reales.
            - Catálogo con MusicBrainz, ListenBrainz y Cover Art Archive: portadas de álbumes y canciones de artistas grandes o pequeños, también bandas en español.
            - Portadas completas en el recuadro de recomendaciones y apertura de canciones en el reproductor compatible instalado.
            - Recomendaciones mezcladas al iniciar, evitando repetir la misma primera canción cuando hay varias disponibles.
            - Caché de recomendaciones y portadas para abrir más rápido y reducir solicitudes; portadas guardadas con límite de almacenamiento.
            - Fondos de pantalla propios, ajuste de desenfoque, colores personalizados y paneles de cristal con color elegible y transparencia de 0 a 100 %.
            - Etiquetas de Música, Video, Ocultar o Automático compartidas con BloomBox, con actualización de la lista de apps.
            - BloomAudio: volumen general de MediaBloom y volumen independiente por app multimedia.

            ### Compatibilidad y próximas mejoras
            - Spotify como reproductor **aún no está integrado completamente**. Su compatibilidad ampliada queda para la próxima actualización.
            - Esta es una IPA independiente, sin firmar, para firmar e instalar con SideStore o una alternativa compatible.
            - MediaBloom conserva identificador propio (com.kdt.BloomBoxMedia) y no reemplaza BloomBox.
            - Para compartir aplicaciones entre ambos, deben usar el mismo App Group autorizado.
            - Algunas portadas o canciones podrían faltar si los catálogos públicos no las contienen. BloomAudio continúa siendo opcional y experimental.

  publish-v201:
    name: Publish MediaBloom v2.0.1
    # Publish only a successful build of the explicit release commit on main.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: MediaBloom v2.0.1')
    needs: build-media
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated MediaBloom standalone IPA
        uses: actions/download-artifact@v4
        with:
          name: MediaBloom-SideStore-unsigned.ipa
          path: release

      - name: Verify IPA and generate SHA-256 checksum
        run: |
          set -euo pipefail
          test -s release/MediaBloom-SideStore-unsigned.ipa
          unzip -t release/MediaBloom-SideStore-unsigned.ipa | tail -n 2
          (cd release && sha256sum MediaBloom-SideStore-unsigned.ipa > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Publish MediaBloom v2.0.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: "MediaBloom 2.0.1 — Meet Bloom"
          target_commitish: ${{ github.sha }}
          prerelease: false
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/MediaBloom-SideStore-unsigned.ipa
            release/SHA256SUMS.txt
          body: |
            ## MediaBloom 2.0.1 — Meet Bloom 🎧

            - New MediaBloom app icon featuring Bloom with headphones, closed eyes and musical notes.
            - Native layered icon with support for light, dark, tinted and Liquid Glass appearances on supported iOS versions.
            - Legacy icon fallbacks for older iOS versions.
            - Existing MediaBloom 2.0 features, independent app identity and shared media labels are preserved.
            - The unsigned standalone IPA is intended for signing and installation with SideStore or a compatible signer. It does not replace BloomBox.

            ## Español

            - Nuevo icono de Bloom con audífonos, ojos cerrados y notas musicales.
            - Icono por capas compatible con las apariencias normal, oscura, tintada y Liquid Glass en versiones de iOS compatibles.
            - Iconos de respaldo para versiones anteriores de iOS.
            - Se conservan las funciones de MediaBloom 2.0 y su instalación independiente de BloomBox.

            Spotify playback is unchanged; this update focuses on the new app icon.
